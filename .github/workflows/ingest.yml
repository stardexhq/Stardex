name: Index events

# Keeps the hosted demo database fresh without an always-on server: every few
# minutes this wakes up, catches everything up to the chain tip, matches new
# payments to invoices, and exits.
on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Never let a slow run overlap the next scheduled one.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Contract to index: a moderate-volume token emitting `transfer` events,
      # so the explorer shows decoded {from,to,amount} rows. To index more,
      # copy the "Catch up" step below (cursors are per-contract, no conflict).
      CONTRACT: CCZP7JXIY2V4UVYVTV3D5YZREYBDES2KMIULISZ2JRR6O5JBHXVLW7UB
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ingestor

      # Bring the hosted database up to the schema this commit expects, so a
      # migration that was merged but not applied can never break the steps below.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: scripts/migrate.sh

      - name: Build ingester
        working-directory: ingestor
        run: cargo build --release -p stardex-cli

      - name: Catch up to the chain tip
        working-directory: ingestor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./target/release/stardex index "$CONTRACT" --once

      # Record new payments into every account added with `stardex accounts add`.
      # Contract streams are skipped here; the step above covers the demo contract.
      - name: Record payments to watched accounts
        working-directory: ingestor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./target/release/stardex run --once --accounts-only

      - name: Match payments to invoices
        working-directory: ingestor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./target/release/stardex reconcile --once

      # Push freshly indexed events to any registered webhook subscriptions.
      # `--once` drains what is due and exits, matching this no-worker setup.
      - name: Deliver webhook subscriptions
        working-directory: ingestor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: ./target/release/stardex streams --once
