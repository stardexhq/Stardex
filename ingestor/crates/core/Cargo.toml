[package]
name = "stardex-core"
description = "Stardex ingestion engine: streams Soroban events and tracks cursors."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Async runtime — lets ingestion wait on the network without blocking.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# HTTP client for talking to Stellar RPC (rustls = no system OpenSSL needed).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# JSON (de)serialization for the JSON-RPC request/response bodies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TODO(#2): add a Postgres driver here when we persist the cursor.
