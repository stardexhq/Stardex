[package]
name = "stardex-decoders"
description = "Pluggable per-contract event decoders for Stardex."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stardex-core = { path = "../core" }
# Parse event topics/data from base64 XDR and render addresses as strkeys.
stellar-xdr = { version = "28", features = ["base64", "std"] }
# Async trait impl for the EventSink, and JSON for the stored event fields.
async-trait = "0.1"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
